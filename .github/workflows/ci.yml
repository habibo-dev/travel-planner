name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner---algerian-travel-agency

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travel-planner---algerian-travel-agency/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
